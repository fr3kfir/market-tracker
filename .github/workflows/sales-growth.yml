name: Update sales growth data

on:
  schedule:
    - cron: '0 11 * * *' # daily, after markets have reported for the day
  workflow_dispatch: {}
  push:
    branches: [master]
    paths: ['.github/workflows/sales-growth.yml'] # TEMP: one-off manual trigger, remove after this run (re-run 3 — 40mo lookback)

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run fetch:sales-growth

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/sales-growth.json
          git diff --staged --quiet || git commit -m "Update sales growth data"
          git push
